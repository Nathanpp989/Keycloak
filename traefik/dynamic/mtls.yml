
# mTLS at the edge — serves mtls.test.local requiring a client cert signed by the
# internal CA. Separate host is deliberate: Traefik resolves tls.options per-SNI,
# so mTLS on a path of app.test.local would force client certs on the whole host.
http:
  routers:
    mtls-demo:
      rule: "Host(`mtls.test.local`)"
      entryPoints:
        - websecure
      service: mtls-app
      tls:
        options: mtls@file
  services:
    mtls-app:
      loadBalancer:
        servers:
          - url: "http://app:8000"

tls:
  options:
    mtls:
      clientAuth:
        clientAuthType: RequireAndVerifyClientCert
        caFiles:
          - /etc/traefik/dynamic/openbao-ca.pem
