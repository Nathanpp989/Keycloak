# Traefik dynamic configuration — ForwardAuth middleware.
http:
  middlewares:
    forward-auth:
      forwardAuth:
        address: "http://app:8000/auth/forward"
        authResponseHeaders:
          - "X-Auth-User"
          - "X-Auth-Subject"
        trustForwardHeader: false

# TLS options are a TOP-LEVEL key (sibling of http, NOT nested under it).
# Nesting under http makes Traefik reject the whole file with
# "field not found, node: tls", which drops the middleware above.
tls:
  options:
    default:
      minVersion: "VersionTLS12"
