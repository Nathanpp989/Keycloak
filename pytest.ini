[pytest]
# Only collect the dedicated test files. This prevents pytest from ever
# collecting the helper functions named test_token_access / test_login_flow
# that live inside the application modules (auth0_connect.py), which are not
# tests and would error if executed as such.
python_files = test_logging_config.py auth0_test.py test_main.py test_rotate.py test_diagnose.py test_openbao.py test_openbao_setup.py test_features.py test_endpoint_smoke.py test_container_check.py test_rate_limit.py
testpaths = .
addopts = -v
