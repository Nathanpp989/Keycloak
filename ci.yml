name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the app's real dependencies from requirements.txt.
          # If this is incomplete (e.g. a missing package like python-multipart),
          # the import of main.py during tests will fail and CI catches it.
          pip install -r requirements.txt
          # Test-only tooling
          pip install pytest responses pyflakes

      - name: Lint (pyflakes)
        run: |
          python -m pyflakes *.py

      - name: Run tests
        env:
          # Dummy values so modules that read env at import/run don't fail.
          # No real services are contacted — all HTTP is mocked in the tests.
          AUTH0_DOMAIN: test.auth0.com
          AUTH0_CLIENT_ID: test-id
          AUTH0_CLIENT_SECRET: test-secret
          KEYCLOAK_URL: http://localhost:8080
        run: |
          python -m pytest