apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-broker
  namespace: auth-broker
  annotations:
    # cert-manager example; adjust to your issuer / controller.
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app.example.com
      secretName: auth-broker-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth-broker
                port:
                  name: http
