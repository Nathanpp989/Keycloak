# compose.yaml — runs the broker API together with a Keycloak instance.
#
# Works with all three of these (they read this same file):
#     docker compose up --build
#     podman compose up --build        # Podman v4.1+ (shells out to compose)
#     podman-compose up --build        # the standalone podman-compose tool
#
# The filename "compose.yaml" is the modern spec name recognised by every one of
# them. Override any AUTH0_* value in a local .env file (auto-loaded) or your
# shell environment before running.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # C1: health endpoints only exist when enabled, and on Keycloak 25+ they
      # are served on the MANAGEMENT port (9000), not 8080.
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    # The Keycloak image has bash but no curl/wget, so use bash's /dev/tcp.
    # C1: check port 9000 (management interface), where /health/ready lives.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  openbao:
    # OpenBao in dev mode: in-memory, auto-unsealed, root token fixed to 'root'.
    # For LOCAL DEVELOPMENT ONLY — dev mode is not durable or secure.
    image: quay.io/openbao/openbao:latest
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
    ports:
      - "8200:8200"
    healthcheck:
      # /v1/sys/health returns 200 when the (dev) server is unsealed & active.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8200 && echo -e 'GET /v1/sys/health HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      # Explicit so both engines pick the same file; Containerfile == Dockerfile.
      dockerfile: Containerfile
    ports:
      - "8000:8000"
    environment:
      # Point the app at the Keycloak service by its compose network name.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Premkey}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-Hello-World-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      # Auth0 / Key Vault — supply these via .env or your shell.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_AUTHZ_EXTENSION_URL: ${AUTH0_AUTHZ_EXTENSION_URL:-}
      KEY_VAULT_URL: ${KEY_VAULT_URL:-}
      KEY_DIR: /data/keys
      # OpenBao (the Z-axis) — dev server on the compose network. Alongside Key
      # Vault, not replacing it. resolve_secret() tries OpenBao then falls back.
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-root}
    volumes:
      # Persist generated RSA keys across restarts.
      - keys:/data/keys
    depends_on:
      keycloak:
        condition: service_healthy
      openbao:
        condition: service_healthy

volumes:
  keys:
