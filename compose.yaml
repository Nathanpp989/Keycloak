# compose.yaml — runs the broker API together with a Keycloak instance.
#
# Works with all three of these (they read this same file):
#     docker compose up --build
#     podman compose up --build        # Podman v4.1+ (shells out to compose)
#     podman-compose up --build        # the standalone podman-compose tool
#
# The filename "compose.yaml" is the modern spec name recognised by every one of
# them. Override any AUTH0_* value in a local .env file (auto-loaded) or your
# shell environment before running.

services:
  # ── Traefik: edge reverse proxy + TLS terminator + ForwardAuth gateway ──────
  # Routes to keycloak, openbao, and the app by hostname, and protects selected
  # routes by delegating the auth decision to the app's /auth/forward endpoint
  # (ForwardAuth). Uses Docker provider labels below for per-service routing.
  #
  # Hostnames resolve via /etc/hosts or a local DNS entry pointing at 127.0.0.1:
  #   127.0.0.1  app.localhost  keycloak.localhost  openbao.localhost
  # (*.localhost already resolves to 127.0.0.1 on most systems.)
  # For the PremAlytics Command Center *.test.local scheme, add explicitly
  # (.test.local does NOT auto-resolve):
  #   127.0.0.1  app.test.local  keycloak.test.local  openbao.test.local  traefik.test.local
  traefik:
    image: traefik:v3.1
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Dev TLS: Traefik's built-in self-signed cert. For real certs, add an
      # ACME/Let's Encrypt resolver or mount your own cert (see dynamic config).
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      - "--accesslog=true"
      # Expose Prometheus metrics on the dashboard/api entrypoint (:8080 inside
      # the container -> :8090 on the host). Scrape http://localhost:8090/metrics
      # for per-router/service request counts, latencies, and status codes.
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"   # Traefik dashboard (http://localhost:8090/dashboard/)
    labels:
      # Route the dashboard at https://traefik.test.local/dashboard/ (in addition
      # to the raw :8090 above). exposedbydefault=false, so Traefik's own
      # container must opt in with traefik.enable=true to be routed.
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.test.local`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      # SECURITY: the dashboard exposes routing/config. Protect it before using
      # this beyond local dev — uncomment and set an htpasswd credential:
      #   htpasswd -nb admin 'yourpassword'   -> user:hash
      # - "traefik.http.routers.dashboard.middlewares=dash-auth"
      # - "traefik.http.middlewares.dash-auth.basicauth.users=admin:$$apr1$$...."
    volumes:
      # Read-only access to the Docker socket so Traefik can discover services.
      # SECURITY NOTE: mounting the Docker socket grants broad host access; for
      # production, use a socket proxy (e.g. tecnativa/docker-socket-proxy) that
      # exposes only the read-only endpoints Traefik needs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      app:
        condition: service_started

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # C1: health endpoints only exist when enabled, and on Keycloak 25+ they
      # are served on the MANAGEMENT port (9000), not 8080.
      KC_HEALTH_ENABLED: "true"
      # Expose Keycloak's own metrics on the management port (9000):
      # http://keycloak:9000/metrics inside the compose network. Login rates,
      # JVM stats, DB pool, etc.
      KC_METRICS_ENABLED: "true"
      # Behind a proxy Keycloak must know its external URL and trust the proxy's
      # forwarded headers, or redirect URIs and issuer come out wrong.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: http://keycloak.localhost
      KC_HOSTNAME_STRICT: "false"
    # No direct host port publish anymore — Traefik fronts it. (Keep the
    # container port internal to the compose network.)
    expose:
      - "8080"
      - "9000"   # management port: /health and /metrics (Prometheus scrapes this)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`) || Host(`keycloak.test.local`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    # The Keycloak image has bash but no curl/wget, so use bash's /dev/tcp.
    # C1: check port 9000 (management interface), where /health/ready lives.
    healthcheck:
      # The Keycloak image ships bash (but NO curl/wget), so we use bash's
      # /dev/tcp support to probe the health endpoint. This is the approach the
      # official Keycloak docs recommend. Health endpoints live on the MANAGEMENT
      # port 9000 (not 8080) and only exist because KC_HEALTH_ENABLED=true above.
      # We invoke bash explicitly: CMD-SHELL uses /bin/sh, and /dev/tcp is a bash
      # feature — running it under sh would silently fail.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.0 200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  openbao:
    # PERSISTENT OpenBao: file storage on a named volume + an auto-init/unseal
    # entrypoint, so data (the PKI CA included) survives restarts — a cert you
    # trust stays trusted across `docker compose up/down`.
    # DEV/LOCAL: the entrypoint stores the unseal key in the data volume to
    # auto-unseal (convenient, but NOT production-secure — production uses a KMS
    # auto-unseal). See openbao/entrypoint.sh. The fixed 'root' token is gone;
    # the real root token is generated on first init (read it with:
    #   docker compose exec openbao cat /openbao/data/bao-init.json ).
    image: quay.io/openbao/openbao:latest
    entrypoint: ["/bin/sh", "/openbao/entrypoint.sh"]
    # Local-dev: run as root so the container can write the named data volume
    # without host uid/gid juggling. (Dev-only, consistent with the plaintext
    # unseal key above.)
    user: "0:0"
    cap_add:
      - IPC_LOCK          # allow mlock in case disable_mlock isn't honored
    volumes:
      - ./openbao/config.hcl:/openbao/config.hcl:ro
      - ./openbao/entrypoint.sh:/openbao/entrypoint.sh:ro
      - openbao-data:/openbao/data
    expose:
      - "8200"
    ports:
      # Host access on loopback so openbao_traefik_cert.py can reach the
      # PERSISTENT OpenBao at http://127.0.0.1:8200 (the CA now lives here).
      - "127.0.0.1:8200:8200"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openbao.rule=Host(`openbao.localhost`) || Host(`openbao.test.local`)"
      - "traefik.http.routers.openbao.entrypoints=websecure"
      - "traefik.http.routers.openbao.tls=true"
      - "traefik.http.services.openbao.loadbalancer.server.port=8200"
      # OpenBao's own API tokens ARE its auth; we don't put ForwardAuth in front
      # of it (that would double-gate and break the OIDC/JWT flows). Routed but
      # not ForwardAuth-protected.
    healthcheck:
      # The OpenBao image is Alpine-based (no bash) but ships wget. /v1/sys/health
      # returns 200 only once initialized+unsealed+active; the entrypoint unseals
      # within start_period, so give it room for the first-boot init+unseal.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  app:
    build:
      context: .
      # Docker's default build file. (Single Dockerfile setup — the Containerfile
      # twin was dropped to avoid case-collision issues on case-insensitive
      # filesystems like macOS.)
      dockerfile: Dockerfile
    # No direct host port publish — Traefik fronts it.
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      # Public router: the auth endpoints themselves (/token, /register,
      # /auth/forward, /) must NOT sit behind ForwardAuth, or you'd need a token
      # to get a token. This router carries no auth middleware.
      - "traefik.http.routers.app-public.rule=(Host(`app.localhost`) || Host(`app.test.local`)) && (PathPrefix(`/token`) || PathPrefix(`/register`) || PathPrefix(`/auth/forward`) || Path(`/`) || PathPrefix(`/keys`) || PathPrefix(`/status`) || PathPrefix(`/health`) || Path(`/metrics`))"
      - "traefik.http.routers.app-public.entrypoints=websecure"
      - "traefik.http.routers.app-public.tls=true"
      - "traefik.http.routers.app-public.service=app"
      # Protected router: everything else on the app host requires a valid token,
      # enforced by the ForwardAuth middleware defined in the dynamic config.
      - "traefik.http.routers.app-protected.rule=Host(`app.localhost`) || Host(`app.test.local`)"
      - "traefik.http.routers.app-protected.entrypoints=websecure"
      - "traefik.http.routers.app-protected.tls=true"
      - "traefik.http.routers.app-protected.service=app"
      - "traefik.http.routers.app-protected.middlewares=forward-auth@file"
      # Higher priority for the public router so its more specific rule wins.
      - "traefik.http.routers.app-public.priority=100"
      - "traefik.http.routers.app-protected.priority=1"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
    environment:
      # Point the app at the Keycloak service by its compose network name.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-Premkey}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-Hello-World-app}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      # Password for the default 'user' the app provisions on startup. Without
      # this the app falls back to "change-me", which is easy to hit by surprise
      # when testing /token. Override via .env or your shell.
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-testpass123}
      # Role required for admin/write operations (create/delete groups and
      # organizations, assign roles, edit other users). A valid token WITHOUT
      # this role gets 403 on those endpoints. Must match a role that exists in
      # your Keycloak realm and is granted to tenant administrators.
      ADMIN_ROLE: ${ADMIN_ROLE:-tenant-admin}
      # Optional platform-operator role that bypasses per-tenant scoping (can
      # manage ALL organizations). Empty by default = strict tenant isolation,
      # no cross-tenant access for anyone. Set only if you need a platform admin.
      SUPERADMIN_ROLE: ${SUPERADMIN_ROLE:-}
      # Tenant-scope user lookups (/users/lookup, /users/membership): a caller
      # may only inspect users who share one of their organizations. On by
      # default; set to "off" for single-tenant deployments where every admin
      # should see every user. Callers with no org claim are never scoped
      # (single-tenant tokens keep working).
      USER_TENANT_SCOPING: ${USER_TENANT_SCOPING:-on}
      # The app provisions an admin user holding ADMIN_ROLE on startup, so the
      # authorization layer is usable out of the box. Set a real password in
      # production; falls back to DEFAULT_USER_PASSWORD if unset.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin-user}
      ADMIN_USER_PASSWORD: ${ADMIN_USER_PASSWORD:-testpass123}
      # Structured logging: JSON (one object per line) is the default so
      # `docker compose logs` is searchable and aggregator-ready. Set
      # LOG_FORMAT=text for human-readable local dev. LOG_LEVEL tunes verbosity.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Auth0 / Key Vault — supply these via .env or your shell.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_AUTHZ_EXTENSION_URL: ${AUTH0_AUTHZ_EXTENSION_URL:-}
      KEY_VAULT_URL: ${KEY_VAULT_URL:-}
      KEY_DIR: /data/keys
      # Bind all interfaces explicitly. The image sets this too, but relying on
      # an implicit image ENV is fragile: if it were ever dropped the app would
      # bind 127.0.0.1 inside the container, the published port would reach
      # nothing, and the healthcheck (which runs INSIDE the container against
      # 127.0.0.1) would still report healthy. Stating it here removes that
      # silent-failure mode.
      HOST: 0.0.0.0
      PORT: 8000
      # The app now sits behind Traefik, so the client IP arrives in
      # X-Forwarded-For. Trust it for rate limiting — but ONLY because Traefik
      # sets it and strips client-supplied copies. Never enable this when the
      # app is directly reachable.
      RATE_LIMIT_TRUST_PROXY: "true"
      # Runtime on/off control (see features.py). 'auto' enables each subsystem
      # only when it is configured and reachable.
      OPENBAO_MODE: ${OPENBAO_MODE:-auto}
      AUTH0_MANAGEMENT_MODE: ${AUTH0_MANAGEMENT_MODE:-auto}
      # Which secrets resolve from OpenBao first (empty = Key Vault only).
      OPENBAO_SECRETS: ${OPENBAO_SECRETS:-}
      # OpenBao (the Z-axis) — dev server on the compose network. Alongside Key
      # Vault, not replacing it. resolve_secret() tries OpenBao then falls back.
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-root}
    volumes:
      # Persist generated RSA keys across restarts.
      - keys:/data/keys
    depends_on:
      keycloak:
        condition: service_healthy
      openbao:
        condition: service_healthy

  # ── Prometheus: scrapes /metrics from app, Traefik, and Keycloak ────────────
  # Pulls each target on a schedule (see monitoring/prometheus.yml) and stores
  # the time series. Reachable at http://localhost:9091 on the host.
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Keep 15 days of data — plenty for a dev/single-host setup, bounded disk.
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      # 9091 on the host (9090 is Prometheus's internal port) to avoid clashing
      # with anything else on 9090.
      - "9091:9090"
    depends_on:
      app:
        condition: service_started

  # ── Alertmanager: routes firing alerts to receivers ─────────────────────────
  # Receives alerts from Prometheus and (once you configure a receiver) sends
  # notifications. With the default config, alerts are visible in its UI at
  # http://localhost:9093 — add a Slack/email/webhook receiver to get notified.
  alertmanager:
    image: prom/alertmanager:v0.28.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      prometheus:
        condition: service_started

  # ── Grafana: dashboards over the Prometheus data ────────────────────────────
  # Auto-provisions the Prometheus datasource and the broker dashboard on start
  # (see monitoring/grafana/provisioning). Reachable at http://localhost:3000.
  # Default login admin/admin unless overridden via .env.
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # This is a local dashboards tool; disable anonymous signups/telemetry.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  keys:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  openbao-data:      # persistent OpenBao storage (PKI CA survives restarts)
