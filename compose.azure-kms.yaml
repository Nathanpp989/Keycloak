# compose.azure-kms.yaml — OpenBao auto-unseal via Azure Key Vault (production).
# Same wiring as compose.transit.yaml, but the seal is Azure Key Vault instead of
# a dev transit bao — so there is no openbao-seal container.
#
#   1. Fill AZURE_* / VAULT_* in .env  (see ./check-azure-kms.sh and README)
#   2. cp openbao/config.azure.hcl.example openbao/config.azure.hcl
#   3. ./check-azure-kms.sh                      # verify the Azure side first
#   4. docker compose -f compose.yaml -f compose.azure-kms.yaml up -d openbao
#   5. docker compose -f compose.yaml -f compose.azure-kms.yaml logs openbao | grep '\[entrypoint\]'
#      -> expect: "auto-unsealed via seal — OpenBao is ready"
#
# Uses a SEPARATE volume (openbao-azure-data) so it never touches your real data.
services:
  openbao:
    entrypoint: ["/bin/sh", "/openbao/entrypoint.sh"]
    environment:
      BAO_AUTO_UNSEAL: "1"
      # Credentials for the Azure Key Vault seal (from .env). Prefer a MANAGED
      # IDENTITY in Azure — then omit AZURE_CLIENT_SECRET and the SDK uses it.
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?set AZURE_TENANT_ID in .env}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?set AZURE_CLIENT_ID in .env}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      VAULT_NAME: ${AZURE_KEY_VAULT_NAME:?set AZURE_KEY_VAULT_NAME in .env}
      VAULT_KEY_NAME: ${AZURE_UNSEAL_KEY_NAME:-openbao-unseal}
    volumes:
      - ./openbao/config.azure.hcl:/openbao/config.hcl:ro
      - ./openbao/entrypoint.sh:/openbao/entrypoint.sh:ro
      - openbao-azure-data:/openbao/data
    cap_add:
      - IPC_LOCK

volumes:
  openbao-azure-data:
