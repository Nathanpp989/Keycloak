name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the app's real dependencies from requirements.txt.
          # If this is incomplete (e.g. a missing package like python-multipart),
          # the import of main.py during tests will fail and CI catches it.
          pip install -r requirements.txt
          # MCP server deps, so test_mcp_server.py actually runs instead of
          # being skipped by its importorskip("mcp") guard.
          pip install -r requirements-mcp.txt
          # Test-only tooling.
          pip install pytest responses pyflakes

      - name: Lint (pyflakes)
        run: |
          python -m pyflakes *.py

      - name: Static container build check
        run: |
          python container_check.py

      - name: Run tests
        env:
          # Dummy values so modules that read env at import/run don't fail.
          # No real services are contacted — all HTTP is mocked in the tests.
          AUTH0_DOMAIN: test.auth0.com
          AUTH0_CLIENT_ID: test-id
          AUTH0_CLIENT_SECRET: test-secret
          KEYCLOAK_URL: http://localhost:8080
        run: |
          python -m pytest

  # ── Live integration: run the app's REAL Keycloak setup against a REAL
  #    Keycloak, then exercise the real auth loop over HTTP. This catches the
  #    class of bug the mocked suite cannot — e.g. the realm-never-created and
  #    user-not-fully-set-up bugs, which both passed the mocked tests and only
  #    broke against a real server. Runs as its own job so the fast mocked
  #    suite above still gives quick per-push feedback.
  live-integration:
    runs-on: ubuntu-latest
    # NOTE: we do NOT use a `services:` block for Keycloak. Service containers
    # can't easily pass the required "start-dev" command to the Keycloak image
    # (the default entrypoint doesn't start the server), so we run Keycloak
    # ourselves as a detached container and poll for readiness below.

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      # The Keycloak image needs an explicit "start-dev" command. The simplest
      # robust approach on Actions is to run Keycloak ourselves as a detached
      # container with the right command, then poll for readiness.
      - name: Start Keycloak (start-dev)
        run: |
          docker run -d --name kc -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.4.0 start-dev --features=organization
          echo "Waiting for Keycloak to answer on :8080 ..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/realms/master || true)
            if [ "$code" = "200" ]; then echo "Keycloak ready after ${i}0s"; exit 0; fi
            sleep 5
          done
          echo "Keycloak did not become ready in time"; docker logs kc | tail -30; exit 1

      - name: Run live integration test
        env:
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: Premkey
          KEYCLOAK_ADMIN_USER: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
          DEFAULT_USER_PASSWORD: testpass123
          # The app's optional subsystems aren't under test here; turn them off
          # so the run is hermetic (no Auth0/OpenBao needed).
          AUTH0_DOMAIN: x
          AUTH0_CLIENT_ID: x
          AUTH0_CLIENT_SECRET: x
          OPENBAO_MODE: "off"
          AUTH0_MANAGEMENT_MODE: "off"
          KEY_DIR: /tmp/keys
        run: |
          mkdir -p /tmp/keys
          python integration_test_live.py

      - name: Keycloak logs on failure
        if: failure()
        run: docker logs kc | tail -50

  smoke:
    runs-on: ubuntu-latest
    # End-to-end curl smoke test of the auth broker: start Keycloak + the app,
    # then run smoke-test.sh (health, M2M tokens, scope guards, user login). This
    # catches regressions in the LIVE auth path that unit tests can't — the exact
    # class of breakage seen in practice (bad provisioning, missing scope, etc.).
    # Runs the app as a process against localhost (no Traefik/OpenBao needed);
    # Traefik routing + TLS are infra, exercised on the host via bootstrap.sh.
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      # Same detached-container approach as live-integration (service containers
      # can't pass Keycloak's required "start-dev" command).
      - name: Start Keycloak (start-dev)
        run: |
          docker run -d --name kc -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:26.4.0 start-dev --features=organization
          echo "Waiting for Keycloak on :8080 ..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/realms/master || true)
            if [ "$code" = "200" ]; then echo "Keycloak ready after ${i}0s"; exit 0; fi
            sleep 5
          done
          echo "Keycloak did not become ready in time"; docker logs kc | tail -30; exit 1

      - name: Start app and run smoke test
        env:
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: Premkey
          KEYCLOAK_ADMIN_USER: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
          DEFAULT_USER_PASSWORD: testpass123
          ADMIN_USER_PASSWORD: testpass123
          # Hermetic: optional subsystems off (no Auth0 / OpenBao needed).
          AUTH0_DOMAIN: x
          AUTH0_CLIENT_ID: x
          AUTH0_CLIENT_SECRET: x
          OPENBAO_MODE: "off"
          AUTH0_MANAGEMENT_MODE: "off"
          KEY_DIR: /tmp/keys
          HOST: 0.0.0.0          # bind all interfaces so the smoke curls reach it
          PORT: "8000"
        run: |
          set -e
          mkdir -p /tmp/keys
          # Start the app; it provisions Keycloak (realm, client, scope, roles) on startup.
          python main.py > /tmp/app.log 2>&1 &
          APP_PID=$!
          echo "Waiting for the app on :8000 ..."
          ready=""
          for i in $(seq 1 40); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/live || true)" = "200" ]; then
              ready=1; echo "App ready"; break
            fi
            # fail fast if the app process died
            kill -0 "$APP_PID" 2>/dev/null || { echo "app process exited early"; cat /tmp/app.log; exit 1; }
            sleep 2
          done
          [ -n "$ready" ] || { echo "app did not become ready"; cat /tmp/app.log; kill "$APP_PID" 2>/dev/null; exit 1; }

          SMOKE=smoke-test.sh; [ -f "$SMOKE" ] || SMOKE=smoke_test.sh
          chmod +x "$SMOKE" || true
          BASE=http://localhost:8000 KC=http://localhost:8080 REALM=Premkey \
            CLIENT=Hello-World-app ADMIN_USER=admin ADMIN_PASS=admin \
            TEST_USER=user TEST_PASS=testpass123 bash "$SMOKE"
          rc=$?
          kill "$APP_PID" 2>/dev/null || true
          exit $rc

      - name: App + Keycloak logs on failure
        if: failure()
        run: |
          echo "=== app ==="; tail -60 /tmp/app.log 2>/dev/null || true
          echo "=== keycloak ==="; docker logs kc 2>/dev/null | tail -40 || true

  # ── Shell lint: every committed .sh must pass shellcheck. These scripts are
  #    the operator surface (bootstrap, smoke, mTLS enable/disable, doctor), so
  #    a quoting or portability bug here is an outage waiting to happen.
  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          # -S warning: fail on warning and above (not style/info nits).
          # -e SC1091: don't fail on "not following sourced file" — the sourced
          #   files (.env, helper libs) aren't present at lint time.
          shellcheck -S warning -e SC1091 $(git ls-files '*.sh')

  # ── Kubernetes manifest validation: the manifests must be well-formed and
  #    schema-valid so `kubectl apply -k k8s/` can't fail on a typo'd field.
  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kubernetes-validate
        run: |
          python -m pip install --upgrade pip
          pip install kubernetes-validate

      - name: Render kustomize and validate against the k8s schema
        run: |
          # The kustomization references secret.yaml, which is gitignored (only
          # secret.example.yaml is committed). Materialize it from the template
          # so `kubectl kustomize` can resolve the resource; its placeholder
          # values are schema-valid, which is all this job checks.
          cp k8s/secret.example.yaml k8s/secret.yaml
          # kustomize ships with recent kubectl; render the overlay to a single
          # stream, then schema-validate every resource.
          kubectl kustomize k8s/ > /tmp/rendered.yaml
          echo "----- rendered manifests -----"
          cat /tmp/rendered.yaml
          python -m kubernetes_validate -k 1.29.0 /tmp/rendered.yaml
